<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZCON Ağıllı Satınalma Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
      <header class="mb-6">
        <h1 class="text-2xl md:text-3xl font-bold">AZCON Ağıllı Satınalma Dashboard</h1>
        <p class="text-slate-600 mt-1">Məhsul və xidmət tələblərinə görə təchizatçıları ağıllı müqayisə edin.</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <aside class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
          <h2 class="text-lg font-semibold mb-4">Axtarış Filtrləri</h2>
          <form id="searchForm" class="space-y-4">
            <div>
              <p class="text-sm font-medium mb-2">Axtarış tipi</p>
              <div class="flex gap-4">
                <label class="inline-flex items-center gap-2"><input type="radio" name="procurementType" value="product" checked class="text-blue-600" /> Məhsul</label>
                <label class="inline-flex items-center gap-2"><input type="radio" name="procurementType" value="service" class="text-blue-600" /> Xidmət</label>
              </div>
            </div>

            <div>
              <label for="query" class="block text-sm font-medium mb-1">Axtarış sözü</label>
              <input id="query" type="text" required class="w-full rounded-xl border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Məs: a4 kagiz və ya pentest xidmeti" />
            </div>

            <div id="productFields" class="space-y-4">
              <div>
                <label for="quantity" class="block text-sm font-medium mb-1">Miqdar</label>
                <input id="quantity" type="number" min="1" value="50" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
              </div>
              <div>
                <label for="deadline" class="block text-sm font-medium mb-1">Çatdırılma tarixi</label>
                <input id="deadline" type="date" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
              </div>
            </div>

            <div id="serviceFields" class="space-y-4 hidden">
              <div>
                <label for="serviceDuration" class="block text-sm font-medium mb-1">Xidmət müddəti</label>
                <input id="serviceDuration" type="text" placeholder="Məs: 6 ay və ya 120 saat" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
              </div>
              <div>
                <label for="startDate" class="block text-sm font-medium mb-1">Başlama tarixi</label>
                <input id="startDate" type="date" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
              </div>
              <div>
                <label for="serviceLevel" class="block text-sm font-medium mb-1">Xidmət səviyyəsi (SLA)</label>
                <select id="serviceLevel" class="w-full rounded-xl border border-slate-300 px-3 py-2">
                  <option value="Standard">Standard</option>
                  <option value="Business">Business</option>
                  <option value="Enterprise 24/7">Enterprise 24/7</option>
                </select>
              </div>
            </div>

            <div>
              <label for="budget" class="block text-sm font-medium mb-1">Büdcə (Maks, AZN)</label>
              <input id="budget" type="number" min="1" step="0.01" value="50000" class="w-full rounded-xl border border-slate-300 px-3 py-2" required />
            </div>

            <div>
              <label for="minReliability" class="block text-sm font-medium mb-1">Minimum Güvənilirlik: <span id="reliabilityValue" class="font-semibold">4.0</span></label>
              <input id="minReliability" type="range" min="1" max="5" step="0.1" value="4.0" class="w-full accent-blue-600" />
            </div>

            <div class="flex items-center gap-2">
              <input id="azconOnly" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-blue-600" />
              <label for="azconOnly" class="text-sm font-medium">Yalnız AZCON daxili</label>
            </div>

            <button id="submitBtn" type="submit" class="w-full rounded-xl bg-blue-600 text-white py-2.5 font-semibold hover:bg-blue-700 transition">Axtar</button>
          </form>
        </aside>

        <section class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Nəticələr Paneli</h2>
            <span id="resultCount" class="text-sm text-slate-500">0 təklif</span>
          </div>

          <div id="loading" class="hidden mb-4 flex items-center gap-3 text-blue-700 bg-blue-50 border border-blue-200 rounded-xl px-4 py-3">
            <div class="h-5 w-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <span>Axtarış aparılır, zəhmət olmasa gözləyin...</span>
          </div>

          <div id="errorBox" class="hidden mb-4 rounded-xl border border-red-200 bg-red-50 text-red-700 px-4 py-3"></div>
          <div id="emptyState" class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-5 py-10 text-center text-slate-500">Filtrləri doldurun və "Axtar" düyməsinə basın.</div>
          <div id="offersContainer" class="hidden grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const quantityInput = document.getElementById("quantity");
    const deadlineInput = document.getElementById("deadline");
    const budgetInput = document.getElementById("budget");
    const serviceDurationInput = document.getElementById("serviceDuration");
    const startDateInput = document.getElementById("startDate");
    const serviceLevelInput = document.getElementById("serviceLevel");
    const minReliabilityInput = document.getElementById("minReliability");
    const reliabilityValue = document.getElementById("reliabilityValue");
    const azconOnlyInput = document.getElementById("azconOnly");
    const productFields = document.getElementById("productFields");
    const serviceFields = document.getElementById("serviceFields");
    const loadingEl = document.getElementById("loading");
    const errorBox = document.getElementById("errorBox");
    const emptyState = document.getElementById("emptyState");
    const offersContainer = document.getElementById("offersContainer");
    const resultCount = document.getElementById("resultCount");

    const plusDays = (d) => new Date(Date.now() + d * 24 * 60 * 60 * 1000).toISOString().split("T")[0];
    deadlineInput.value = plusDays(7);
    startDateInput.value = plusDays(3);

    minReliabilityInput.addEventListener("input", () => {
      reliabilityValue.textContent = Number(minReliabilityInput.value).toFixed(1);
    });

    function getProcurementType() {
      return document.querySelector('input[name="procurementType"]:checked').value;
    }

    function toggleModeFields() {
      const type = getProcurementType();
      const isProduct = type === "product";
      productFields.classList.toggle("hidden", !isProduct);
      serviceFields.classList.toggle("hidden", isProduct);
      quantityInput.required = isProduct;
      deadlineInput.required = isProduct;
      serviceDurationInput.required = !isProduct;
      startDateInput.required = !isProduct;
      serviceLevelInput.required = !isProduct;
    }

    document.querySelectorAll('input[name="procurementType"]').forEach((el) => el.addEventListener("change", toggleModeFields));
    toggleModeFields();

    function showLoading(isLoading) {
      loadingEl.classList.toggle("hidden", !isLoading);
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function renderStars(score) {
      const rounded = Math.round(score);
      return "★".repeat(rounded) + "☆".repeat(5 - rounded);
    }

    function sourceBadge(sourceType) {
      const internal = sourceType === "Internal AZCON";
      return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${internal ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}">${sourceType}</span>`;
    }

    function renderOffers(offers, type) {
      offersContainer.innerHTML = "";
      if (!offers.length) {
        offersContainer.classList.add("hidden");
        emptyState.classList.remove("hidden");
        emptyState.textContent = "Nəticə tapılmadı";
        resultCount.textContent = "0 təklif";
        return;
      }

      offers.forEach((offer) => {
        const linkHtml = offer.source_link === "Internal"
          ? '<span class="text-slate-500 text-sm">Internal</span>'
          : `<a href="${offer.source_link}" target="_blank" class="text-blue-600 hover:underline text-sm break-all">Mənbəyə bax</a>`;

        const modeInfo = type === "product"
          ? `<p class="text-slate-500">Mövcud miqdar</p><p class="font-semibold">${offer.quantity_available ?? 0}</p>`
          : `<p class="text-slate-500">Xidmət müddəti</p><p class="font-semibold">${offer.service_duration ?? "-"}</p>`;

        const card = document.createElement("article");
        card.className = "rounded-2xl border border-slate-200 p-4 bg-white shadow-sm";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-3">
            <div>
              <h3 class="font-semibold text-base">${offer.item_name}</h3>
              <p class="text-sm text-slate-600">${offer.company_name}</p>
            </div>
            ${sourceBadge(offer.source_type)}
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm mb-3">
            <div class="bg-slate-50 rounded-xl p-3"><p class="text-slate-500">1 vahid qiymət</p><p class="font-semibold">${Number(offer.price_per_unit).toFixed(2)} AZN</p></div>
            <div class="bg-slate-50 rounded-xl p-3"><p class="text-slate-500">Ümumi qiymət</p><p class="font-semibold">${Number(offer.total_price).toFixed(2)} AZN</p></div>
            <div class="bg-slate-50 rounded-xl p-3">${modeInfo}</div>
            <div class="bg-slate-50 rounded-xl p-3"><p class="text-slate-500">Güvənilirlik</p><p class="font-semibold text-amber-600">${renderStars(Number(offer.reliability_score))} <span class="text-slate-700">(${Number(offer.reliability_score).toFixed(1)})</span></p></div>
          </div>
          <div class="mb-2">
            <p class="text-xs uppercase tracking-wide text-slate-500">Logistika</p>
            <p class="text-sm text-slate-700">${offer.logistics_info || "Məlumat yoxdur"}</p>
          </div>
          <div class="pt-2 border-t border-slate-100">${linkHtml}</div>
        `;
        offersContainer.appendChild(card);
      });

      emptyState.classList.add("hidden");
      offersContainer.classList.remove("hidden");
      resultCount.textContent = `${offers.length} təklif`;
    }

    async function onSubmit(event) {
      event.preventDefault();
      clearError();
      showLoading(true);
      const type = getProcurementType();

      const payload = {
        procurement_type: type,
        query: queryInput.value.trim(),
        budget: Number(budgetInput.value),
        min_reliability_score: Number(minReliabilityInput.value),
        azcon_reference_required: azconOnlyInput.checked
      };

      if (type === "product") {
        payload.quantity = Number(quantityInput.value);
        payload.deadline = deadlineInput.value;
      } else {
        payload.service_duration = serviceDurationInput.value.trim();
        payload.start_date = startDateInput.value;
        payload.service_level = serviceLevelInput.value;
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let data;
        try {
          data = await response.json();
        } catch (_) {
          throw new Error("JSON parse xətası baş verdi.");
        }

        if (!response.ok) {
          throw new Error(data.detail || "Backend xətası baş verdi.");
        }

        renderOffers(Array.isArray(data.offers) ? data.offers : [], type);
      } catch (err) {
        offersContainer.classList.add("hidden");
        emptyState.classList.remove("hidden");
        emptyState.textContent = "Nəticə tapılmadı";
        resultCount.textContent = "0 təklif";
        const errorMessage = String(err && err.message ? err.message : "");
        if (errorMessage.includes("Failed to fetch") || errorMessage.includes("NetworkError")) {
          showError("Serverlə əlaqə qurulmadı. FastAPI serverinin (http://127.0.0.1:8000) işlədiyinə əmin olun.");
        } else {
          showError(errorMessage || "Naməlum xəta baş verdi.");
        }
      } finally {
        showLoading(false);
      }
    }

    form.addEventListener("submit", onSubmit);
  </script>
</body>
</html>
