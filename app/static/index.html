<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZCON Procurement</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo">A</div>
          <div>
            <h1>AZCON</h1>
            <p>Smart Procurement</p>
          </div>
        </div>

        <div class="sidebar-meta">
          <div class="field"><label>İstifadəçi</label><div id="userName" class="profile-text">-</div></div>
          <div class="field"><label>Rol</label><div id="userRole" class="profile-text">-</div></div>
          <div class="field"><label>Şirkət</label><div id="userCompany" class="profile-text">-</div></div>
          <div class="field"><label>Departament</label><div id="userDepartment" class="profile-text">-</div></div>
        </div>
        <button id="btnLogout" class="btn">Logout</button>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <h2>AZCON Vendor Hub</h2>
            <p>Şirkətlər, uğur faizi, sifariş və AI tövsiyə axını.</p>
          </div>
        </header>

        <section class="section-group">
          <div class="section-head"><h3>1) Vendor Ana Səhifə</h3></div>
          <div id="vendorsOut" class="output output-xl"></div>
          <div id="vendorProfileOut" class="output output-xl"></div>
        </section>

         <section class="section-group role-view" data-roles="procurement_decider,company_admin,platform_admin">
          <div class="section-head"><h3>2) Sifariş Formu</h3></div>
          <div class="form-row">
            <div class="field"><label>Məhsul / Xidmət adı</label><input id="reqTitle" placeholder="Məs: Eskalator ehtiyat hissələri və ya Tibbi müayinə" /></div>
            <div class="field"><label>Tip</label><select id="reqItemType"><option value="product">Product</option><option value="service">Service</option></select></div>
            <div class="field"><label>Say</label><input id="reqQty" type="number" value="1" /></div>
            <div class="field"><label>Vendor</label><select id="reqVendorId"></select></div>
            <div class="field"><label>Çatdırılma tarixi</label><input id="reqDeliveryDate" value="2026-05-10" /></div>
          </div>
          <div class="field">
            <label>Spesifikasiya</label>
            <textarea id="reqDescription" rows="3" placeholder="Ətraflı tələbi yazın"></textarea>
          </div>
          <button id="btnManualNeed" class="btn">➕ Digər ehtiyac (Əllə daxil et)</button>
          <button id="btnCreateRequest" class="btn btn-primary">Sifarişi Yarat</button>
          <div id="reqOut" class="output"></div>
        </section>

        <section class="section-group role-view" data-roles="procurement_decider,company_admin,platform_admin">
          <div class="section-head"><h3>3) AI Recommendation</h3></div>
          <div class="actions">
            <select id="recommendReqId"></select>
            <select id="topN"><option value="3">Top 3</option><option value="5">Top 5</option><option value="10">Top 10</option></select>
            <button id="btnRecommend" class="btn btn-primary">AI Tövsiyə Ver</button>
          </div>
          <div id="recommendOut" class="output"></div>
        </section>

        <section class="section-group role-view" data-roles="company_admin,platform_admin">
          <div class="section-head"><h3>4) Domain Leader Analytics</h3></div>
          <div class="actions"><button id="btnLoadAnalytics" class="btn">Pie Chart Datasını Yüklə</button></div>
          <div id="analyticsOut" class="output output-xl"></div>
        </section>
      </main>
    </div>

    <script src="app.js?v=8"></script>
  </body>
</html>
